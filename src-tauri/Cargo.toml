[package]
name = "aqua-launcher"
version = "2.0.0"
description = "Aqua Launcher - Minecraft Launcher"
authors = ["Yaman"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
zip = "2.2"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
uuid = { version = "1.10", features = ["v4", "v3", "serde"] }
open = "5.3"
dirs = "6.0"
chrono = "0.4"
regex = "1.11"
walkdir = "2.5"
urlencoding = "2.1"

# lighty launcher suite
lighty-launcher = { version = "26.5.12", features = ["all-loaders", "all-mods", "events"] }
lighty-core = "26.5.12"
lighty-auth = { version = "26.5.12", features = ["events"] }
lighty-java = "26.5.12"
lighty-launch = { version = "26.5.12", features = ["events", "forge", "neoforge", "modrinth", "curseforge"] }
lighty-loaders = { version = "26.5.12", features = ["all-loaders"] }
lighty-version = "26.5.12"
lighty-event = "26.5.12"
lighty-modsloader = { version = "26.5.12", features = ["all-mods"] }

[profile.dev]
debug = 1
